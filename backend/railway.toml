[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "node dist/server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[env]
PORT = "3001"
# Add other environment variables here as needed
# FRONTEND_URL = "..."
# DATABASE_URL = "..."

[watch]
paths = ["backend/**"]
