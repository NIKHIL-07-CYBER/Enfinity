[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && npm run build && ls -la dist/server/"

[deploy]
startCommand = "cd backend && node dist/server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[env]
FRONTEND_URL = "https://adaptive-reader.vercel.app"
NODE_ENV = "production"
# Backend domain: https://enfinity-production.up.railway.app
